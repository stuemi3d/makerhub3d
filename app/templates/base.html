<!doctype html>
<html lang="{{ language }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="container">
    <nav aria-label="{{ t('nav.label') }}">
      <ul>
        <li><strong>{{ app_name }}</strong></li>
      </ul>
      <ul class="main-nav">
        {% for item in nav_items %}
        <li>
          {% if item.href %}
          <a href="{{ item.href }}"{% if item.key == current_nav %} aria-current="page"{% endif %}>{{ t(item.key) }}</a>
          {% else %}
          <a aria-disabled="true" tabindex="-1" title="{{ t('nav.not_available') }}">{{ t(item.key) }}</a>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

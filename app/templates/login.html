{% extends "base.html" %}
{% block title %}{{ t('login.title') }} – {{ app_name }}{% endblock %}
{% block content %}
<article class="auth-box">
  <h1>{{ t('login.title') }}</h1>
  {% if failed %}
  <p role="alert"><mark>{{ t('login.failed') }}</mark></p>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">{{ t('login.field.username') }}</label>
    <input type="text" id="username" name="username" value="{{ username }}" maxlength="50" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">{{ t('login.field.password') }}</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">{{ t('login.submit') }}</button>
  </form>
</article>
{% endblock %}

    <li><a href="/articles"{% if area == 'articles' %} aria-current="page"{% endif %}>{{ t('articles.title') }}</a></li>

    <li><a href="/attributes"{% if area == 'attributes' %} aria-current="page"{% endif %}>{{ t('attributes.title') }}</a></li>
  </ul>
</nav>

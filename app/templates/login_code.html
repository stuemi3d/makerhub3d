{% extends "base.html" %}
{% block title %}{{ t('login_code.title') }} – {{ app_name }}{% endblock %}
{% block content %}
<article class="auth-box">
  <h1>{{ t('login_code.title') }}</h1>
  {% if failed %}
  <p role="alert"><mark>{{ t('login_code.failed') }}</mark></p>
  {% endif %}
  <form method="post" action="/login/code">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="code">{{ t('two_factor.field.code') }}</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" maxlength="100" aria-describedby="code-hint" required autofocus>
    <small id="code-hint">{{ t('login_code.hint') }}</small>
    <button type="submit">{{ t('login_code.submit') }}</button>
  </form>
  <p><a href="/login">{{ t('login_code.cancel') }}</a></p>
</article>
{% endblock %}

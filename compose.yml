# MakerHub 3D, hardened as described in docs/plan.md (section 8).
# The port is published on 127.0.0.1 only; reach the app through a reverse proxy.
# Configuration comes from a local .env file (never committed, see .env.example).
services:
  app:
    build: .
    # Default: build locally. Set MAKERHUB_IMAGE (see .env.example) to run a published version.
    image: ${MAKERHUB_IMAGE:-makerhub3d:local}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - makerhub-data:/data
    ports:
      - "127.0.0.1:${MAKERHUB_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false

volumes:
  makerhub-data:

# Alembic configuration for the command line (e.g. `uv run alembic revision --autogenerate`).
# The app itself runs the migrations on start. The database location comes from
# MAKERHUB_DATA_DIR (see .env.example), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

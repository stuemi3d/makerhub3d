[project]
name = "makerhub3d"
version = "0.1.0"
description = "Self-hosted tool for small 3D printing businesses: articles, costing, production, stock and analysis."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.162.5",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.8",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Browser tests are slower and need Chromium: `uv run pytest -m browser` runs only them.
addopts = "-ra --strict-markers -m 'not browser' --screenshot only-on-failure --full-page-screenshot --output test-results"
markers = ["browser: tests that drive a real browser against a local test app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use invented passwords and tokens (S105, S106).
"tests/**" = ["S101", "S105", "S106"]

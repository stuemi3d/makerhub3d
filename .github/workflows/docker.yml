# Builds the container image and scans it with Trivy for every pull request and push to main.
# The image is only built and checked here: it is not published and nothing is deployed.
name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: no job in this workflow writes anything.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image bauen und prüfen (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not published)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: makerhub3d:ci

      - name: Start container with the hardened settings and check /healthz
        run: |
          docker run -d --name makerhub --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --user 10001:10001 -v makerhub-test-data:/data \
            -p 127.0.0.1:8000:8000 makerhub3d:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz | grep -qx ok; then
              echo "healthz ok"; exit 0
            fi
            sleep 1
          done
          docker logs makerhub
          exit 1

      # Fails (red) on findings of severity HIGH or CRITICAL that already have a fix.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: makerhub3d:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

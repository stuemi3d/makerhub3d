# Builds the container image and scans it with Trivy for every pull request and push to main.
# Only after a push to main, and only when build and scan are green, the scanned image is
# published to ghcr.io. Pull requests never publish. Nothing is deployed.
name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token by default. Only the publish job below asks for more.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image bauen und prüfen (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not published)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: makerhub3d:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Start container with the hardened settings and check /healthz
        run: |
          docker run -d --name makerhub --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --user 10001:10001 -v makerhub-test-data:/data \
            -p 127.0.0.1:8000:8000 makerhub3d:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz | grep -qx ok; then
              echo "healthz ok"; exit 0
            fi
            sleep 1
          done
          docker logs makerhub
          exit 1

      # Fails (red) on findings of severity HIGH or CRITICAL that already have a fix.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: makerhub3d:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Hand the exact image that was just scanned over to the publish job.
      - name: Save scanned image
        run: docker save makerhub3d:ci --output image.tar

      - name: Upload scanned image for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    name: Image veröffentlichen (ghcr.io)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job with write access, and only to packages.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load scanned image
        run: docker load --input image.tar

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push (latest and short commit hash)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag makerhub3d:ci "$IMAGE:latest"
          docker tag makerhub3d:ci "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"

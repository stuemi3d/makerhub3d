# Blocks pull requests that add dependencies with known vulnerabilities.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Abhängigkeiten (Dependency Review)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No checkout needed: the action compares base and head via the GitHub API.
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

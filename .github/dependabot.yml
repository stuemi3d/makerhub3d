# Dependabot: weekly update proposals as pull requests.
# Version updates are bundled into one PR per ecosystem (groups).
# Security updates are not grouped and still arrive immediately and individually.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # The project is pinned to Python 3.12; moving to a newer Python is a
    # deliberate maintainer decision, so only small updates are proposed.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker-base-image:
        patterns:
          - "*"

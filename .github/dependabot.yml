# Dependabot: weekly update proposals as pull requests.
# Version updates are bundled into one PR per ecosystem (groups).
# Security updates are not grouped and still arrive immediately and individually.
# The Docker base image is added together with the Dockerfile (issue #5).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
